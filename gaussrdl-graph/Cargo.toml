[package]
name = "gaussrdl-graph"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/gaussrdl"
description = "Advanced graph construction and manipulation for GaussRDL with high-performance algorithms"

[dependencies]
gaussrdl-core = { path = "../gaussrdl-core" }
candle-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true, optional = true }
rand = { workspace = true, features = ["std_rng", "small_rng"] }
lru = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

# Advanced graph algorithms and data structures
petgraph = "0.6"
dashmap = { version = "5.5", optional = true }
crossbeam = { version = "0.8", optional = true }
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
ordered-float = "4.0"

# Memory optimization and performance
jemallocator = { version = "0.5", optional = true }
mimalloc = { version = "0.1", optional = true }
typed-arena = "2.0"

# Advanced algorithms
algorithms = "0.1"
priority-queue = "1.3"
indexmap = "2.0"

# Parallel processing and async
tokio = { version = "1.0", features = ["full"], optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }

# Mathematical and statistical operations
ndarray = "0.15"
ndarray-stats = "0.5"
statrs = "0.16"

# Graph visualization and analysis
graphviz-rust = { version = "0.1", optional = true }
plotters = { version = "0.3", optional = true }

# Compression and serialization
bincode = "1.3"
zstd = { version = "0.12", optional = true }
lz4 = { version = "1.9", optional = true }

# Metrics and monitoring
metrics = { version = "0.21", optional = true }
prometheus = { version = "0.13", optional = true }
gaussrdl-metrics = { path = "../gaussrdl-metrics" }

# Configuration and validation
config = "0.13"
validator = "0.16"

[features]
default = ["jemalloc", "parallel", "dep:metrics"]
jemalloc = ["dep:jemallocator"]
mimalloc = ["dep:mimalloc"]
parallel = ["dep:rayon", "dep:crossbeam", "dep:dashmap"]
async = ["dep:tokio", "dep:async-trait", "dep:futures"]
visualization = ["dep:graphviz-rust", "dep:plotters"]
compression = ["dep:zstd", "dep:lz4"]
monitoring = ["dep:metrics", "dep:prometheus"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true 