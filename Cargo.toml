[package]
name = "relbench"
version = "1.0.0"
edition = "2021"
description = "A high-performance Rust implementation of the Relational Deep Learning Benchmark"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/relbench"
documentation = "https://docs.rs/relbench"
readme = "README.md"
keywords = ["machine-learning", "deep-learning", "benchmark", "relational", "graph"]
categories = ["science", "machine-learning"]

[dependencies]
# Core dependencies
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Data processing
polars = { version = "0.35", features = ["lazy", "parquet"] }
chrono = { version = "0.4", features = ["serde"] }

# Memory management
memmap2 = "0.9"
parking_lot = "0.12"

# Parallel processing
rayon = "1.8"
num_cpus = "1.16"

# Networking
reqwest = { version = "0.11", features = ["blocking", "json"] }
url = "2.5"

# Logging and metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.9"
tokio-test = "0.4"
assert_fs = "1.0"
predicates = "3.0"
criterion = "0.5"
proptest = "1.4"

[features]
default = []
cuda = []
metal = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0
debug = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]