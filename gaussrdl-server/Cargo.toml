[package]
name = "gaussrdl-server"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/gaussrdl"
description = "HTTP server and API for GaussRDL"

[dependencies]
gaussrdl-core = { path = "../gaussrdl-core" }
gaussrdl-data = { path = "../gaussrdl-data" }
gaussrdl-models = { path = "../gaussrdl-models" }
gaussrdl-training = { path = "../gaussrdl-training" }
axum = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true } 