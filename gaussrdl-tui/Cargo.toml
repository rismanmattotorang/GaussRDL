[package]
name = "gaussrdl-tui"
version = "0.2.0"
edition = "2021"
authors = ["Gaussian Technologies <research@gaussian.tech>"]
license = "MIT"
description = "Terminal UI for the GaussRDL v2 engine: configure model parameters and monitor training live."

[dependencies]
gaussrdl-rdl = { path = "../gaussrdl-rdl" }
gaussrdl-bench = { path = "../gaussrdl-bench" }
ratatui = "0.28"

[[bin]]
name = "gaussrdl-tui"
path = "src/main.rs"
